<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="title desc">
  <title id="title">P01 r1 proposed scene regions</title>
  <desc id="desc">Four schematic canvases define Sunrise Agenda and Meadow alarm regions at normal and large text. These are diagrams, not artwork or rendered UI.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#14203a}.h{font-size:28px;font-weight:700}.sub{font-size:18px}.label{font-size:18px;font-weight:600}.small{font-size:16px}.safe{fill:#fff;stroke:#44546b;stroke-width:2;stroke-dasharray:7 5}.scene{fill:#eac994;stroke:#98701e;stroke-width:2}.plant{fill:#bcdac7;stroke:#356c4a;stroke-width:2}.canvas{stroke:#566273;stroke-width:2}</style>
  <rect width="1400" height="880" fill="#f5f6f8"/>
  <text x="32" y="44" class="h">P01-style-r1 · proposed regions</text>
  <text x="32" y="76" class="sub">Schematic only · 360×800 canvas shown at common scale · no corrected artwork / UI yet</text>
  <g transform="translate(32 110)">
    <text y="25" class="label">Sunrise Agenda · 100%</text>
    <rect y="48" width="270" height="600" fill="#fffbf2" class="canvas"/>
    <rect x="1" y="460" width="268" height="186" class="scene"/>
    <text x="22" y="559" class="small">Landscape 25–33%</text>
    <text x="22" y="585" class="small">anchor (0.5, 1.0)</text>
    <rect x="12" y="64" width="246" height="76" class="safe"/><text x="30" y="105" class="small">Header / grouping</text>
    <rect x="12" y="156" width="246" height="58" class="safe"/>
    <rect x="12" y="226" width="246" height="58" class="safe"/>
    <rect x="12" y="296" width="246" height="58" class="safe"/>
    <rect x="12" y="366" width="246" height="58" class="safe"/>
    <rect x="12" y="436" width="246" height="58" class="safe"/>
    <text x="28" y="192" class="small">Opaque reminder rows</text>
    <rect x="202" y="558" width="44" height="44" rx="10" class="safe"/><text x="208" y="586" class="small">Add</text>
    <rect x="12" y="613" width="246" height="26" class="safe"/>
    <text y="687" class="small">Scenery remains visible at edges</text><text y="713" class="small">and around the Add region.</text>
  </g>
  <g transform="translate(377 110)">
    <text y="25" class="label">Sunrise Agenda · 200%</text>
    <rect y="48" width="270" height="600" fill="#fffbf2" class="canvas"/>
    <rect x="1" y="550" width="268" height="96" class="scene"/>
    <text x="18" y="587" class="small">Motif retained</text>
    <rect x="12" y="64" width="246" height="112" class="safe"/><text x="27" y="111" class="small">Growing header</text>
    <rect x="12" y="192" width="232" height="132" class="safe"/><text x="27" y="250" class="small">Wrapping titles</text>
    <rect x="12" y="340" width="232" height="132" class="safe"/><text x="27" y="398" class="small">Same semantics</text>
    <rect x="250" y="192" width="6" height="346" fill="#566273"/>
    <text x="24" y="510" class="small">Scrollable content</text>
    <rect x="202" y="553" width="44" height="44" rx="10" class="safe"/><text x="208" y="581" class="small">Add</text>
    <rect x="12" y="612" width="246" height="28" class="safe"/>
    <text y="687" class="small">Smaller scene region, no global fade.</text><text y="713" class="small">Actions stay reachable.</text>
  </g>
  <g transform="translate(722 110)">
    <text y="25" class="label">Meadow alarm · 100%</text>
    <rect y="48" width="270" height="600" fill="#f5faf6" class="canvas"/>
    <rect x="1" y="49" width="268" height="270" class="plant"/>
    <rect x="1" y="319" width="36" height="170" class="plant"/><rect x="233" y="319" width="36" height="170" class="plant"/>
    <text x="21" y="95" class="small">Edge botanical clusters</text><text x="21" y="121" class="small">upper 45–55% + sides</text>
    <rect x="43" y="142" width="184" height="170" class="safe"/><text x="62" y="191" class="small">Quiet source zone</text><text x="64" y="220" class="small">x 0.16–0.84</text>
    <rect x="40" y="328" width="190" height="132" class="safe"/><text x="57" y="359" class="small">Title / delivery</text><text x="57" y="386" class="small">Time / status</text><text x="57" y="427" class="small">8–12 dp gaps</text>
    <rect x="12" y="482" width="246" height="49" class="safe"/><text x="32" y="512" class="small">Actual Stop button</text>
    <rect x="12" y="543" width="246" height="49" class="safe"/><text x="32" y="573" class="small">Actual Snooze button</text>
    <text x="18" y="622" class="small">Unfinished / feedback</text>
    <text y="687" class="small">One coherent information/action flow.</text><text y="713" class="small">Top-center anchor (0.5, 0.0).</text>
  </g>
  <g transform="translate(1067 110)">
    <text y="25" class="label">Meadow alarm · 200%</text>
    <rect y="48" width="270" height="600" fill="#f5faf6" class="canvas"/>
    <rect x="1" y="49" width="268" height="72" class="plant"/><rect x="1" y="121" width="22" height="300" class="plant"/><rect x="247" y="121" width="22" height="300" class="plant"/>
    <text x="18" y="92" class="small">64–96 dp top motif</text>
    <rect x="32" y="137" width="202" height="190" class="safe"/><text x="47" y="176" class="small">Enlarged title</text><text x="47" y="208" class="small">and delivery time</text><text x="47" y="253" class="small">Growing information</text><text x="47" y="287" class="small">and status</text>
    <rect x="12" y="350" width="230" height="68" class="safe"/><text x="29" y="390" class="small">Growing Stop</text>
    <rect x="12" y="434" width="230" height="68" class="safe"/><text x="29" y="474" class="small">Growing Snooze</text>
    <rect x="12" y="518" width="230" height="104" class="safe"/><text x="26" y="556" class="small">Unfinished explanation</text><text x="26" y="589" class="small">and error feedback</text>
    <rect x="251" y="137" width="6" height="485" fill="#566273"/>
    <text y="687" class="small">Flow scrolls when needed.</text><text y="713" class="small">Decoration yields to measured bounds.</text>
  </g>
  <text x="32" y="856" class="small">Dashed regions = component-rendered reading / action areas. Diagrams define relationships; final measured layout requires render approval.</text>
</svg>
