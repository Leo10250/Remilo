<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title description">
<title id="title">P01 r2 proposed composition relationships</title>
<desc id="description">Three annotated flow diagrams for Agenda, single-member alarm and the later editor study. These are documentation diagrams, not artwork or component renders.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#17243b}.title{font-size:23px;font-weight:700}.sub{font-size:15px;fill:#47586c}.label{font-size:17px;font-weight:600}.body{font-size:15px}.frame{fill:#fff;stroke:#b9c5ce;stroke-width:1}.block{fill:#f0f4f6;stroke:#c5cfd7}.note{fill:#47586c;font-size:14px}</style></defs>
<rect width="1240" height="760" fill="#f8f7f2"/>
<text x="32" y="39" class="title">Composition language · proposed r2</text>
<text x="32" y="65" class="sub">Documentary relationships. No corrected assets, functioning controls or final pixel dimensions.</text>
<rect x="32" y="90" width="370" height="630" rx="14" class="frame"/>
<rect x="434" y="90" width="370" height="630" rx="14" class="frame"/>
<rect x="836" y="90" width="372" height="630" rx="14" class="frame"/>
<text x="52" y="125" class="title">Sunrise Agenda</text><text x="52" y="149" class="sub">P01 actual RN representative</text>
<rect x="52" y="170" width="330" height="62" rx="8" class="block"/>
<text x="65" y="196" class="label">Remilo</text><text x="369" y="196" class="body" text-anchor="end">Search / Overflow</text><text x="65" y="217" class="note">≥48 dp actions · heading grows</text>
<rect x="52" y="246" width="330" height="48" rx="8" class="block"/>
<text x="65" y="274" class="body">Useful context / active filters only</text>
<text x="56" y="323" class="label">Today</text><text x="378" y="323" class="body" text-anchor="end">filtered total</text>
<rect x="52" y="340" width="330" height="97" rx="16" fill="#fffaf1" stroke="#ddcfb7"/>
<text x="65" y="368" class="label">○    Title + meaningful glyph</text>
<text x="105" y="393" class="body">Event range · list / repeat context</text>
<text x="105" y="416" class="note">Explicit exception when consequential</text>
<rect x="52" y="449" width="330" height="61" rx="16" fill="#fffaf1" stroke="#ddcfb7"/>
<text x="65" y="480" class="body">○    Another tile · natural height</text>
<path d="M53 554 Q125 520 204 545 T381 526" fill="none" stroke="#c89945" stroke-width="3" stroke-dasharray="5 4"/>
<text x="65" y="575" class="note">Landscape behind / around content</text>
<text x="65" y="598" class="note">No mandatory blank footer / Add strip</text>
<rect x="52" y="617" width="330" height="54" rx="8" class="block"/>
<text x="65" y="650" class="label">Agenda</text><text x="191" y="650" class="label">Lists</text><text x="289" y="650" class="label">Repeats</text>
<text x="52" y="697" class="note">One Add above nav · content clearance</text>
<text x="454" y="125" class="title">Meadow alarm</text><text x="454" y="149" class="sub">P01 actual Compose representative</text>
<path d="M455 170 L476 278 M783 170 L761 278 M455 209 Q526 169 568 193 M783 211 Q717 163 671 193" stroke="#82ac90" stroke-width="3" stroke-dasharray="5 4" fill="none"/>
<text x="499" y="233" class="body">Edge-rooted environmental art</text><text x="518" y="257" class="note">Quiet central reading region</text>
<rect x="469" y="302" width="300" height="146" rx="8" class="block"/>
<text x="520" y="337" class="title">Water plants</text>
<text x="504" y="366" class="note">Current ringing delivery</text>
<text x="574" y="397" class="title">08:00</text>
<text x="538" y="426" class="body">● Alarm ringing</text>
<text x="495" y="475" class="note">Bounded gap · no expanding middle</text>
<rect x="469" y="496" width="300" height="61" rx="8" fill="#e7f1e9" stroke="#81a68b"/>
<text x="557" y="532" class="label">Filled Stop</text>
<rect x="469" y="569" width="300" height="61" rx="8" class="frame"/>
<text x="522" y="605" class="label">Outlined Snooze · 10 min</text>
<text x="467" y="656" class="note">Stop leaves work unfinished · error / Retry</text>
<text x="454" y="680" class="note">Captured member · initial canvas per session</text>
<text x="454" y="704" class="note">200%: shorter art, continuous scroll</text>
<text x="856" y="125" class="title">Editor language</text><text x="856" y="149" class="sub">P06 study recommended · not P01 work</text>
<rect x="856" y="170" width="332" height="62" rx="8" class="block"/>
<text x="869" y="196" class="body">Back</text><text x="930" y="196" class="label">Add reminder</text><text x="1175" y="196" class="body" text-anchor="end">Save</text><text x="869" y="217" class="note">Test keyboard / reach / busy states</text>
<rect x="856" y="246" width="332" height="62" rx="8" class="frame"/><text x="869" y="281" class="label">Title field</text>
<text x="869" y="341" class="label">When</text><text x="1010" y="341" class="label">[Date]</text><text x="1120" y="341" class="label">[Time]</text><text x="869" y="364" class="note">Direct separate ≥48 dp picker targets</text>
<path d="M869 376 H1175 M869 421 H1175 M869 468 H1175 M869 515 H1175" stroke="#d3dbe1"/>
<text x="869" y="406" class="body">Repeat</text><text x="1175" y="406" class="body" text-anchor="end">Summary →</text>
<text x="869" y="453" class="body">Alert</text><text x="1175" y="453" class="body" text-anchor="end">Alarm / Notification / None →</text>
<text x="869" y="500" class="body">List</text><text x="1175" y="500" class="body" text-anchor="end">Selected name →</text>
<text x="869" y="548" class="body">Notes</text><text x="1175" y="548" class="body" text-anchor="end">Add / existing visible</text>
<rect x="856" y="573" width="332" height="63" rx="8" class="block"/>
<text x="869" y="598" class="body">Schedule / Alarm options · warnings</text><text x="869" y="621" class="note">Due, delivery, zones, all-day preserved</text>
<text x="856" y="666" class="note">No root nav · no fixed decorative blank area</text>
<text x="856" y="691" class="note">No duplicate Save by default · error recovery</text>
<text x="32" y="747" class="sub">All: system text growth, contrast-safe content, ≥48 dp hit bounds, non-color state and quiet decoration.</text>
</svg>
