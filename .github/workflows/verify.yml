name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Download pinned Temurin JDK
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/remilo-jdk.tar.gz" 'https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.20.1%2B1/OpenJDK17U-jdk_x64_linux_hotspot_17.0.20.1_1.tar.gz'
          echo "3808d1d15e3ec6bd5b84057fb5d84c33d8a1536a258146bcea2e603fc726e08e  $RUNNER_TEMP/remilo-jdk.tar.gz" | sha256sum --check
      - uses: actions/setup-java@v5
        with:
          distribution: jdkfile
          jdk-file: ${{ runner.temp }}/remilo-jdk.tar.gz
          # setup-java's cache label requires SemVer; archive/checksum pins 17.0.20.1+1.
          java-version: '17.0.20'
      - run: npm ci
      - run: chmod +x android/gradlew
      - name: Install Android build packages
        run: |
          task_sdkmanager="$(rg --files "$ANDROID_HOME/cmdline-tools" | rg '/bin/sdkmanager$' | sort -V | tail -n 1)"
          test -x "$task_sdkmanager"
          "$task_sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;36.0.0' 'build-tools;35.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - run: npm run verify:android
