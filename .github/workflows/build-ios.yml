name: Build Remilo iOS
on:
  workflow_dispatch:
  push:
    branches: [Add-iOS-support]
    paths:
      - ios/**
      - src/**
      - modules/remilo-alarm/**
      - assets/**
      - localization/**
      - verification/fixtures/recurrence.json
      - verification/ios-archive/**
      - verification/ios-calendar/**
      - verification/ios-engine/**
      - verification/ios-media/**
      - scripts/configure-ios-test-ipa.py
      - app.config.js
      - app.json
      - package*.json
      - .nvmrc
      - .github/workflows/build-ios.yml
permissions:
  contents: read
jobs:
  swift-engine:
    concurrency:
      group: remilo-ios-engine-${{ github.ref }}
      cancel-in-progress: true
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the Swift engine, recurrence and widget policies
        run: |
          xcodebuild -version
          REMILO_WIDGET_FIXTURE=1 sh verification/ios-engine/run.sh
  unsigned-ipa:
    needs: swift-engine
    concurrency:
      group: remilo-ios-${{ github.ref }}
      cancel-in-progress: false
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install iOS dependencies
        working-directory: ios
        run: pod install
      - name: Check portable archives and routine photos
        run: |
          sh verification/ios-archive/run.sh
          sh verification/ios-media/run.sh
      - name: Build Remilo for iPhone and iPad
        shell: bash
        run: |
          log="$RUNNER_TEMP/remilo-xcodebuild.log"
          if ! xcodebuild -quiet \
            -workspace ios/Remilo.xcworkspace \
            -scheme Remilo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/Remilo-build" \
            CODE_SIGNING_ALLOWED=NO build >"$log" 2>&1; then
            grep -inE 'error:|undefined symbols|command .* failed|^ld:' "$log" | tail -n 60 || true
            tail -n 120 "$log"
            exit 1
          fi
      - name: Verify and package the unsigned iOS app
        shell: bash
        run: |
          app="$RUNNER_TEMP/Remilo-build/Build/Products/Release-iphoneos/Remilo.app"
          stage="$RUNNER_TEMP/remilo-ipa"
          ipa="$RUNNER_TEMP/Remilo-unsigned.ipa"
          for resource in main.jsbundle remilo_alarm.wav; do
            test -s "$app/$resource" || { echo "Missing app resource: $resource"; exit 1; }
          done
          test -d "$app/Metadata.appintents" || { echo "Missing App Intents metadata"; exit 1; }
          test ! -e "$app/PlugIns/RemiloWidgets.appex" || { echo "Standard IPA contains optional widget"; exit 1; }
          test "$(/usr/libexec/PlistBuddy -c 'Print :DTPlatformName' "$app/Info.plist")" = 'iphoneos'
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:0' "$app/Info.plist")" = '1'
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:1' "$app/Info.plist")" = '2'
          mkdir -p "$stage/Payload"
          ditto "$app" "$stage/Payload/Remilo.app"
          ditto -c -k --keepParent "$stage/Payload" "$ipa"
          unzip -tq "$ipa"
      - name: Check local Calendar configuration on the packaged app
        run: |
          python3 scripts/configure-ios-test-ipa.py \
            "$RUNNER_TEMP/Remilo-unsigned.ipa" "$RUNNER_TEMP/Remilo-calendar-fixture.ipa" \
            --bundle-id com.remilo.app.FIXTUREABC --client-id 123-fixture.apps.googleusercontent.com
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Remilo-unsigned
          path: ${{ runner.temp }}/Remilo-unsigned.ipa
          if-no-files-found: error
          retention-days: 3
  widget-and-calendar:
    concurrency:
      group: remilo-ios-checks-${{ github.ref }}
      cancel-in-progress: true
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check Calendar authorization, connection and browse policies
        run: sh verification/ios-calendar/run.sh
      - name: Check the unsigned IPA configuration helper
        run: python3 verification/ios-calendar/configure-ipa-check.py
      - name: Check host signing settings for both widget modes
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          for mode in NO YES; do
            xcodebuild -project ios/Remilo.xcodeproj -target Remilo -configuration Release \
              -sdk iphoneos "REMILO_WIDGETS_ENABLED=$mode" -showBuildSettings -json |
              ruby -rjson -e '
                settings = JSON.parse(STDIN.read).find { |entry| entry["target"] == "Remilo" }.fetch("buildSettings")
                path = settings.fetch("CODE_SIGN_ENTITLEMENTS", "")
                root = settings.fetch("SRCROOT")
                valid = if ARGV[0] == "YES"
                  File.expand_path(path, root) == File.join(root, "Remilo", "RemiloWidgetsHost.entitlements")
                else
                  path.empty?
                end
                abort "Unexpected host entitlements for widget mode #{ARGV[0]}: #{path.inspect}" unless valid
              ' "$mode"
          done
      - name: Build the optional WidgetKit extension
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          log="$RUNNER_TEMP/remilo-widget-build.log"
          if ! xcodebuild -quiet \
            -project ios/Remilo.xcodeproj \
            -scheme RemiloWidgets \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/RemiloWidgets-build" \
            CODE_SIGNING_ALLOWED=NO build >"$log" 2>&1; then
            grep -inE 'error:|undefined symbols|command .* failed|^ld:' "$log" | tail -n 60 || true
            tail -n 120 "$log"
            exit 1
          fi
          extension="$RUNNER_TEMP/RemiloWidgets-build/Build/Products/Release-iphoneos/RemiloWidgets.appex"
          test -s "$extension/RemiloWidgets" || { echo "Missing WidgetKit executable"; exit 1; }
          test -d "$extension/Metadata.appintents" || { echo "Missing widget App Intents metadata"; exit 1; }
