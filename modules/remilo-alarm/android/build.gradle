plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
  id 'com.google.devtools.ksp'
  id 'org.jetbrains.kotlin.plugin.compose'
}

group = 'com.remilo.alarm'
version = '0.1.0'

android {
  namespace "com.remilo.alarm"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  buildFeatures { compose true }
  testOptions {
    unitTests.includeAndroidResources = true
  }
  sourceSets { test.resources.srcDir('schemas'); test.resources.srcDir('../../../verification/fixtures') }
  lint { abortOnError true }
}

expoModule { canBePublished false }
ksp { arg('room.schemaLocation', "$projectDir/schemas") }
// Resolve test SDKs through Gradle before tests start, instead of Robolectric's
// separate Maven downloader failing partway through a CI test class. These are
// the API 34 runtime and API 35 resource SDKs used by pinned Robolectric 4.17.
configurations {
  robolectricSdk34 { canBeConsumed = false; canBeResolved = true }
  robolectricSdk35 { canBeConsumed = false; canBeResolved = true }
}
def prepareRobolectricSdkJars = tasks.register('prepareRobolectricSdkJars', Sync) {
  // Separate configurations retain both versions of the same Maven module.
  from(configurations.robolectricSdk34, configurations.robolectricSdk35)
  into(layout.buildDirectory.dir('robolectric-sdks'))
}
tasks.withType(Test).configureEach {
  dependsOn(prepareRobolectricSdkJars)
  systemProperty 'robolectric.dependency.dir', layout.buildDirectory.dir('robolectric-sdks').get().asFile.absolutePath
}
dependencies {
  implementation 'androidx.glance:glance-appwidget:1.2.0'
  implementation 'androidx.glance:glance-material3:1.2.0'
  testImplementation 'androidx.glance:glance-appwidget-testing:1.2.0'
  implementation 'com.google.android.gms:play-services-auth:22.0.0'
  implementation 'androidx.room:room-runtime:2.8.5'
  implementation 'androidx.work:work-runtime:2.12.0'
  ksp 'androidx.room:room-compiler:2.8.5'
  implementation 'androidx.core:core-ktx:1.16.0'
  implementation 'androidx.activity:activity-compose:1.10.1'
  implementation platform('androidx.compose:compose-bom:2025.04.01')
  implementation 'androidx.compose.material3:material3'
  implementation 'androidx.compose.ui:ui'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'androidx.work:work-testing:2.12.0'
  testImplementation 'org.robolectric:robolectric:4.17'
  robolectricSdk34('org.robolectric:android-all-instrumented:14-robolectric-10818077-i7') { transitive = false }
  robolectricSdk35('org.robolectric:android-all-instrumented:15-robolectric-13954326-i7') { transitive = false }
}
